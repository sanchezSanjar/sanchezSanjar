name: Profile images

on:
  schedule:
    - cron: "0 0 * * *"   # every day
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["images/profile/**"]

permissions:
  contents: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Stats and top-languages cards, drawn here because the public card service is often down.
      # Runs before the snake: the snake runs in Docker as root and would leave dist/ read-only.
      - name: Stats cards
        run: python3 .github/scripts/stats_cards.py ${{ github.repository_owner }} dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # SNAKE_TOKEN (read:user) lets the snake count private contributions; falls back to public only.
          github_token: ${{ secrets.SNAKE_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      # Saved into images/profile on master, where the README loads them from.
      - name: Save images
        if: github.ref == 'refs/heads/master'
        run: |
          mkdir -p images/profile
          cp dist/*.svg images/profile/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/profile
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "update profile images"
            git pull --rebase origin master
            git push origin HEAD:master
          fi
